[package]
name = "disk-master"
version = "1.3.0"
description = "Очистка диска, анализ места и мониторинг Windows"
authors = ["Development SPB"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "multithread"] }
walkdir = "2"
rayon = "1"
sha2 = "0.10"
blake3 = "1"
trash = "5"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
chrono = "0.4"
arboard = "3"
base64 = "0.22"
jwalk = "0.8"
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
